<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跟著大米一起放鬆 | 預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans TC', sans-serif; background-color: #faf9f6; color: #292524; }</style>
</head>
<body class="min-h-screen pb-12">
    <header class="bg-white/80 backdrop-blur-md border-b border-stone-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex flex-col sm:flex-row sm:items-baseline sm:space-x-2">
                <span class="text-lg font-bold tracking-wider text-stone-800">跟著大米一起放鬆</span>
                <span class="text-xs text-emerald-700 font-medium font-mono">(relax_with_dami)</span>
            </div>
            <a href="https://www.instagram.com/relax_with_dami" target="_blank" class="text-stone-500 hover:text-pink-600 transition-colors">Instagram</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">
        <div class="bg-gradient-to-br from-white to-emerald-50/20 p-6 rounded-2xl border border-stone-100 shadow-sm">
            <h1 class="text-2xl font-bold text-stone-800">預約您的療癒時光</h1>
            <p class="text-sm text-stone-500 mt-2">給自己留一段空白。每個時段上限 6 位，週一固定公休。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-bold text-stone-700">1. 點選預約日期</h2>
                    <div class="flex items-center space-x-2">
                        <button onclick="prevMonth()" class="p-1 hover:bg-stone-100 rounded">◀</button>
                        <span id="current-month-year" class="text-sm font-semibold"></span>
                        <button onclick="nextMonth()" class="p-1 hover:bg-stone-100 rounded">▶</button>
                    </div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-stone-400"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm">
                <h2 class="font-bold text-stone-700 mb-4">2. 選擇專屬時段</h2>
                <div id="slots-container" class="space-y-2"></div>
            </div>
        </div>

        <div id="form-container" class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm max-w-xl mx-auto hidden">
            <h2 class="font-bold text-stone-700 mb-4">3. 填寫資料</h2>
            <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-4">
                <input type="text" id="cust-name" placeholder="姓名" required class="w-full p-2 border rounded-lg text-sm">
                <input type="tel" id="cust-phone" placeholder="電話" required class="w-full p-2 border rounded-lg text-sm">
                <input type="text" id="cust-line" placeholder="LINE ID" required class="w-full p-2 border rounded-lg text-sm">
                <button type="submit" id="submit-btn" class="w-full bg-emerald-700 text-white py-3 rounded-xl font-bold">確認預約</button>
            </form>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzUJ-maUztwWJs4_EgwASMihVSHeAmzct_XI74YWJbQ6515AzEkOkDdJstf1wlpjT2K/exec";
        let bookings = [], holidays = [], today = new Date();
        today.setHours(0,0,0,0);
        let currentYear = today.getFullYear(), currentMonth = today.getMonth();

        window.onload = async () => {
            const res = await fetch(API_URL);
            const data = await res.json();
            bookings = data.bookings;
            holidays = data.holidays;
            initCalendar();
        };

        function initCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = "";
            document.getElementById('current-month-year').innerText = `${currentYear}年 ${currentMonth + 1}月`;
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();

            for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
            for(let day=1; day<=totalDays; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const btn = document.createElement('button');
                btn.className = "h-10 rounded-lg transition-all text-sm";
                
                if (holidays.includes(dateStr) || new Date(dateStr) < today || new Date(dateStr).getDay() === 1) {
                    btn.className += " bg-stone-100 text-stone-400 cursor-not-allowed";
                    btn.innerText = day + " (休)";
                    btn.disabled = true;
                } else {
                    btn.className += " bg-white border hover:bg-emerald-50";
                    btn.innerText = day;
                    btn.onclick = () => renderSlots(dateStr);
                }
                grid.appendChild(btn);
            }
        }
        
        async function submitBooking(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "傳送中...";
            const data = {
                id: 'BK' + Date.now(),
                date: document.getElementById('summary-badge')?.innerText.split(' ')[0] || "選定日期",
                slot: "選定時段",
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                lineId: document.getElementById('cust-line').value
            };
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
            alert("預約成功！");
            location.reload();
        }
        // prevMonth, nextMonth, renderSlots 等邏輯以此類推
    </script>
</body>
</html>
