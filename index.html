<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跟著大米一起放鬆 (relax_with_dami) | 預約系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #faf9f6; color: #292524; }
        /* 讀取中的動畫遮罩 */
        #loading-overlay { transition: opacity 0.3s; }
    </style>
</head>
<body class="min-h-screen pb-12 relative">

    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex flex-col items-center justify-center">
        <svg class="animate-spin h-10 w-10 text-emerald-700 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-stone-600 font-medium tracking-widest text-sm">正在同步最新的預約空檔...</p>
    </div>

    <header class="bg-white/80 backdrop-blur-md border-b border-stone-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex flex-col sm:flex-row sm:items-baseline sm:space-x-2">
                <span class="text-lg font-bold tracking-wider text-stone-800">跟著大米一起放鬆</span>
                <span class="text-xs text-emerald-700 font-medium font-mono">(relax_with_dami)</span>
            </div>
            <a href="https://www.instagram.com/relax_with_dami" target="_blank" rel="noopener noreferrer" class="text-stone-500 hover:text-pink-600 transition-colors">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">
        <div class="bg-gradient-to-br from-white to-emerald-50/20 p-6 rounded-2xl border border-stone-100 shadow-sm">
            <h1 class="text-2xl font-bold text-stone-800 mb-2">預約您的療癒時光</h1>
            <p class="text-sm text-stone-500">給自己留一段空白，找回內心的平靜。每個時段上限 6 位，週一為大米的休息日。</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-bold flex items-center text-stone-700">
                        <span class="w-5 h-5 rounded-full bg-emerald-700 text-white text-xs flex items-center justify-center mr-2">1</span>點選日期
                    </h2>
                    <div class="flex items-center space-x-1 bg-stone-50 rounded-full p-1 border border-stone-100">
                        <button onclick="prevMonth()" id="prev-month-btn" class="p-1.5 rounded-full hover:bg-white text-stone-600 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                        <div class="text-sm font-semibold text-stone-700 min-w-[80px] text-center" id="current-month-year"></div>
                        <button onclick="nextMonth()" class="p-1.5 rounded-full hover:bg-white text-stone-600 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-stone-400 mb-2">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm flex flex-col">
                <h2 class="text-base font-bold flex items-center text-stone-700 mb-4">
                    <span class="w-5 h-5 rounded-full bg-emerald-700 text-white text-xs flex items-center justify-center mr-2">2</span>選擇時段
                </h2>
                <div id="selected-date-display" class="text-xs font-medium text-emerald-800 mb-4 bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100/40 hidden"></div>
                <div id="slots-container" class="grid grid-cols-1 gap-2 overflow-y-auto max-h-[320px] pr-1">
                    <p class="text-sm text-stone-400 text-center py-12">請先在左側日曆選擇預約日期</p>
                </div>
            </div>
        </div>

        <div id="form-container" class="bg-white p-6 rounded-2xl border border-stone-100 shadow-sm max-w-xl mx-auto hidden transition-all">
            <h2 class="text-base font-bold flex items-center text-stone-700 mb-6">
                <span class="w-5 h-5 rounded-full bg-emerald-700 text-white text-xs flex items-center justify-center mr-2">3</span>填寫旅程資料
            </h2>
            <div id="summary-badge" class="mb-6 p-3 bg-stone-50 border border-stone-100 rounded-xl text-sm text-stone-700 font-medium"></div>
            
            <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="cust-name" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">電話號碼 <span class="text-red-500">*</span></label>
                    <input type="tel" id="cust-phone" required pattern="[0-9]{9,11}" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">LINE ID <span class="text-red-500">*</span></label>
                    <input type="text" id="cust-line" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 text-sm">
                </div>
                <button type="submit" id="submit-btn" class="w-full mt-2 bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-md transition-all text-sm tracking-wider">
                    確認安排預約
                </button>
            </form>
        </div>
    </main>

    <div id="success-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full mx-4 text-center shadow-xl transform scale-95 transition-transform duration-300">
            <h3 class="text-lg font-bold text-stone-800 mb-2">預約成功囉！</h3>
            <p class="text-sm text-stone-500 mb-6">專屬的放鬆時光已為您保留，大米會透過 LINE 盡快與您聯繫。</p>
            <button onclick="closeModal()" class="w-full bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-sm">好的</button>
        </div>
    </div>

    <script>
        // 你的 Google Apps Script API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbzUJ-maUztwWJs4_EgwASMihVSHeAmzct_XI74YWJbQ6515AzEkOkDdJstf1wlpjT2K/exec";
        
        let today = new Date();
        today.setHours(0, 0, 0, 0);
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); 
        
        let selectedDateStr = "";
        let selectedSlotStr = "";
        const MAX_CAPACITY = 6;
        let bookings = [];

        // 頁面載入時，直接去雲端抓取最新的預約資料
        window.onload = async function() {
            try {
                const response = await fetch(API_URL);
                bookings = await response.json();
            } catch (error) {
                console.error("無法載入資料庫", error);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
                initCalendar();
            }
        };

        function prevMonth() {
            if (currentYear === today.getFullYear() && currentMonth === today.getMonth()) return;
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            resetSelection();
            initCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            resetSelection();
            initCalendar();
        }

        function resetSelection() {
            selectedDateStr = "";
            selectedSlotStr = "";
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('slots-container').innerHTML = '<p class="text-sm text-stone-400 text-center py-12">請先在左側選擇日期</p>';
            document.getElementById('selected-date-display').classList.add('hidden');
        }

        function getBookedCount(dateStr, slotStr) {
            return bookings.filter(b => b.date === dateStr && b.slot === slotStr).length;
        }

        function isDayFullyBooked(dateStr) {
            for (let h = 9; h <= 21; h++) {
                if (getBookedCount(dateStr, `${String(h).padStart(2, '0')}:00`) < MAX_CAPACITY) return false;
            }
            return true;
        }

        function initCalendar() {
            const grid = document.getElementById('calendar-grid');
            document.getElementById('current-month-year').innerText = `${currentYear}年 ${["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"][currentMonth]}`;
            grid.innerHTML = "";
            const prevBtn = document.getElementById('prev-month-btn');
            
            if (currentYear === today.getFullYear() && currentMonth === today.getMonth()) {
                prevBtn.classList.add('opacity-30', 'cursor-not-allowed');
            } else {
                prevBtn.classList.remove('opacity-30', 'cursor-not-allowed');
            }

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= totalDays; day++) {
                const dayBtn = document.createElement('button');
                dayBtn.type = "button";
                dayBtn.innerText = day;
                
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                dayBtn.className = "h-10 text-sm font-medium rounded-xl flex items-center justify-center transition-all focus:outline-none ";
                const thisDate = new Date(currentYear, currentMonth, day);
                
                if (thisDate < today) {
                    dayBtn.className += "text-stone-300 cursor-not-allowed bg-stone-50/50"; dayBtn.disabled = true;
                } else if (thisDate.getDay() === 1) {
                    dayBtn.className += "text-stone-300 cursor-not-allowed bg-stone-100/50"; dayBtn.disabled = true; dayBtn.innerText += " (休)";
                } else if (isDayFullyBooked(dateStr)) {
                    dayBtn.className += "text-red-400 bg-red-50/40 line-through cursor-not-allowed"; dayBtn.disabled = true;
                } else {
                    if (dateStr === selectedDateStr) dayBtn.className += "bg-emerald-700 text-white shadow-md scale-105";
                    else dayBtn.className += "text-stone-700 hover:bg-emerald-50";
                    dayBtn.onclick = () => selectDate(dateStr);
                }
                grid.appendChild(dayBtn);
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('form-container').classList.add('hidden');
            selectedSlotStr = "";
            const display = document.getElementById('selected-date-display');
            display.innerText = `已選取預約日期：${dateStr}`;
            display.classList.remove('hidden');
            initCalendar();
            renderTimeSlots(dateStr);
        }

        function renderTimeSlots(dateStr) {
            const container = document.getElementById('slots-container');
            container.innerHTML = "";
            for (let hour = 9; hour <= 21; hour++) {
                const slotStr = `${String(hour).padStart(2, '0')}:00`;
                const nextHourStr = `${String(hour + 1).padStart(2, '0')}:00`;
                const remaining = MAX_CAPACITY - getBookedCount(dateStr, slotStr);
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = "w-full p-3.5 border text-left rounded-xl transition-all flex justify-between text-sm font-medium ";
                
                if (remaining <= 0) {
                    btn.className += "border-stone-100 bg-stone-50 text-stone-400 cursor-not-allowed";
                    btn.disabled = true;
                    btn.innerHTML = `<span>${slotStr} - ${nextHourStr}</span><span class="px-2 py-0.5 rounded-md text-xs bg-stone-200 text-stone-500">已滿</span>`;
                } else {
                    if (slotStr === selectedSlotStr) {
                        btn.className += "border-emerald-700 bg-emerald-700 text-white";
                        btn.innerHTML = `<span>${slotStr} - ${nextHourStr}</span><span class="px-2 py-0.5 rounded-md text-xs bg-white/20 text-white">已選定</span>`;
                    } else {
                        btn.className += "border-stone-200 text-stone-700 hover:border-emerald-600";
                        const alertClass = remaining <= 2 ? "bg-amber-50 text-amber-700" : "bg-stone-100 text-stone-500";
                        btn.innerHTML = `<span>${slotStr} - ${nextHourStr}</span><span class="px-2 py-0.5 rounded-md text-xs ${alertClass}">餘 ${remaining} 位</span>`;
                    }
                    btn.onclick = () => selectSlot(slotStr, nextHourStr, remaining);
                }
                container.appendChild(btn);
            }
        }

        function selectSlot(slotStr, nextHourStr, remaining) {
            if (remaining <= 0) return;
            selectedSlotStr = slotStr;
            renderTimeSlots(selectedDateStr);
            const form = document.getElementById('form-container');
            document.getElementById('summary-badge').innerText = `預約時間：${selectedDateStr} ${selectedSlotStr} - ${nextHourStr}`;
            form.classList.remove('hidden');
            setTimeout(() => form.scrollIntoView({ behavior: 'smooth' }), 100);
        }

        async function submitBooking(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "資料傳送中，請稍候...";

            const newBooking = {
                id: 'BK' + Date.now(),
                date: selectedDateStr,
                slot: selectedSlotStr,
                name: document.getElementById('cust-name').value.trim(),
                phone: document.getElementById('cust-phone').value.trim(),
                lineId: document.getElementById('cust-line').value.trim()
            };

            try {
                // 將資料以 POST 方式寫入 Google 試算表
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(newBooking)
                });
                
                // 本地預先新增以即時更新畫面，不須重整
                bookings.push(newBooking);
                document.getElementById('booking-form').reset();
                document.getElementById('form-container').classList.add('hidden');
                selectedSlotStr = "";
                initCalendar();
                renderTimeSlots(selectedDateStr);
                
                // 顯示成功彈窗
                const modal = document.getElementById('success-modal');
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modal.querySelector('div').classList.remove('scale-95');
                }, 10);

            } catch (error) {
                alert("預約發生錯誤，請稍後再試。");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "確認安排預約";
            }
        }

        function closeModal() {
            const modal = document.getElementById('success-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    </script>
</body>
</html>
